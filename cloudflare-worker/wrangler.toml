name = "bulltherapy-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

[placement]
mode = "smart"

# KV namespace for storing daily top picks
# To create: wrangler kv:namespace create TOP_PICKS_KV
# Then paste the resulting id below
[[kv_namespaces]]
binding = "TOP_PICKS_KV"
id = "a43c22764cb748c1858abca757cd2213"

# Cron: run every 2 minutes — rolling scan of ~10 stocks per run → full 500-stock scan in ~1.7 hours
# KV writes: ~720/day (well under 1,000 free tier limit with combined state+scores key)
[triggers]
crons = ["*/2 * * * *"]
